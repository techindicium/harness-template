contradictions_registered:
  - id: C1
    summary: "Mart still implements self_service_rate v2; metric-definitions.yaml declares v3 current since 2026-07-01"
    sources:
      - project/models/marts/self_service.sql
      - project/metrics/metric-definitions.yaml
      - docs/pr-notes/0088-self-service-v3.md
  - id: C2
    summary: "docs/incidents/README.md lists only INCIDENT-01 and INCIDENT-02; INCIDENT-03.md exists in the same directory"
    sources:
      - docs/incidents/README.md
      - docs/incidents/INCIDENT-03.md
  - id: C3
    summary: "REQUEST-007 and REQUEST-011 may be the same number; no confirmation recorded"
    sources:
      - data/tracker.csv
      - data/requests/REQUEST-011.docx
  - id: C4
    summary: "Extract manifest has no lower coverage bound; extract period vs. reporting period is never compared in the pipeline"
    sources:
      - data/ops-extract/extract-manifest.yaml
      - project/run.py
  - id: C5
    summary: "POLICY-13 requires version citation in packs; no mart emits a version field"
    sources:
      - docs/policies.md
      - project/models/marts/self_service.sql
  - id: C6
    summary: "INCIDENT-03 attributes figure change to v2->v3 transition; v3 was never computable (human_edit_material absent from extract)"
    sources:
      - docs/incidents/INCIDENT-03.md
      - data/ops-extract/suggestion.csv
      - project/models/staging/stg_suggestions.sql
      - project/metrics/metric-definitions.yaml

members:
