contradictions_registered:
  - id: C1
    summary: "Mart still implements self_service_rate v2; metric-definitions.yaml declares v3 current since 2026-07-01"
    sources:
      - project/models/marts/self_service.sql
      - project/metrics/metric-definitions.yaml
      - docs/pr-notes/0088-self-service-v3.md
  - id: C2
    summary: "docs/incidents/README.md lists only INCIDENT-01 and INCIDENT-02; INCIDENT-03.md exists in the same directory"
    sources:
      - docs/incidents/README.md
      - docs/incidents/INCIDENT-03.md
  - id: C3
    summary: "REQUEST-007 and REQUEST-011 may be the same number; no confirmation recorded"
    sources:
      - data/tracker.csv
      - data/requests/REQUEST-011.docx
  - id: C4
    summary: "Extract manifest has no lower coverage bound; extract period vs. reporting period is never compared in the pipeline"
    sources:
      - data/ops-extract/extract-manifest.yaml
      - project/run.py
  - id: C5
    summary: "POLICY-13 requires version citation in packs; no mart emits a version field"
    sources:
      - docs/policies.md
      - project/models/marts/self_service.sql
  - id: C6
    summary: "INCIDENT-03 attributes the figure change to v2->v3; change note 0088 says the mart still applies v2; the July pack shows self-service moving from 0 to 0.3478. The July extract's columns are UNKNOWN. Cause UNKNOWN."
    sources:
      - docs/incidents/INCIDENT-03.md
      - docs/pr-notes/0088-self-service-v3.md
      - data/ops-extract/suggestion.csv
      - project/models/staging/stg_suggestions.sql
      - project/metrics/metric-definitions.yaml
      - project/tests/self_service_rate_in_range.sql
      - ../portwell-knowledge/data/packs/2026-07/ACCOUNT-1008-2026-07.xlsx
  - id: C7
    summary: "first_response.sql counts actor IN ('agent', 'portal'); the extract calls the portal's reply 'assist', so 296 tickets drop out and today's build does not reproduce the published attainment or p50"
    sources:
      - project/models/marts/first_response.sql
      - project/models/marts/sla_attainment.sql
      - project/metrics/metric-definitions.yaml
      - data/ops-extract/interaction.csv
      - ../portwell-knowledge/data/figures/warehouse-export-2026-08-06.csv
      - ../portwell-knowledge/data/figures/warehouse-export-2026-08-29.csv
      - ../portwell-knowledge/data/packs/2026-07/ACCOUNT-1008-2026-07.xlsx
  - id: C8
    summary: "self_service_rate v2 is account-day over tickets closed in the period; the mart is account-month over every ticket opened in the month, open ones included, and the extract has no close date"
    sources:
      - project/metrics/metric-definitions.yaml
      - project/models/marts/self_service.sql
      - data/ops-extract/ticket.csv
  - id: C9
    summary: "The interview says the tests check non-zero row counts and duplicate keys; none of the 6 tests does, and all 6 pass against empty tables"
    sources:
      - docs/interviews/2026-08-12 Declan Byrne, where the numbers come from.docx
      - project/tests/
  - id: C10
    summary: "stg_extract_metadata says it records when the snapshot was taken; it records now() at build time, in local time with a Z suffix"
    sources:
      - project/models/staging/stg_extract_metadata.sql
      - docs/how-we-work-today.md
      - data/ops-extract/extract-manifest.yaml
  - id: C11
    summary: "The track README describes a harness built inside the track repository and a make verify target, neither of which exists; harness-template forbids changing the track repository"
    sources:
      - README.md
      - STUDENT-GUIDE.md
      - ../harness-template/README.md
  - id: C12
    summary: "The data dictionary names columns and marts the models do not have (was_self-served, marts.response_times, marts.inventory_accuracy) and describes closed_tickets as closed tickets"
    sources:
      - docs/data-dictionary.xlsx
      - docs/backlog.md
      - project/models/
  - id: C13
    summary: "INCIDENT-03 cites ISSUE-13 in the Portal engineering backlog as the same consumer-list problem; ISSUE-13 there is 'No link between an escalation and its issue'"
    sources:
      - docs/incidents/INCIDENT-03.md
      - ../portwell-engineering/docs/backlog.md
      - ../portwell-engineering/data/tracker.csv
  - id: C14
    summary: "REQUEST-009 cites POLICY-11 to justify an August-only first-response median; POLICY-11, defined in the product track, covers resolution time over a trailing ninety days"
    sources:
      - data/requests/REQUEST-009.docx
      - docs/policies.md
      - ../portwell-product/docs/Policies.docx
  - id: C15
    summary: "INCIDENT-03 (written 2026-08-06) names TICKET-004424 as the June-to-July pack question; the ticket was opened 2026-08-20, reports a six-point drop on the dashboard, and is still open"
    sources:
      - docs/incidents/INCIDENT-03.md
      - data/ops-extract/ticket.csv
      - ../portwell-knowledge/data/packs/2026-07/ACCOUNT-1008-2026-07.xlsx

